<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlamitertech - Apresentação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 380px;
            background: #18181c;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #2a2a32;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .brand-header {
            font-size: 0.85rem;
            color: #38ef7d;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 15px;
        }

        /* Container do Vídeo da IA */
        .video-box {
            position: relative;
            width: 100%;
            height: 420px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #000;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .action-area {
            width: 100%;
        }

        .instagram-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(56, 239, 125, 0.3);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }

        .instagram-box p {
            font-size: 0.95rem;
            color: #cccccc;
            margin-bottom: 8px;
        }

        .instagram-link {
            display: inline-block;
            color: #38ef7d;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .instagram-link:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="brand-header">Carlamitertech</div>

        <!-- Vídeo da IA com movimento perfeito de boca e olhos -->
        <div class="video-box">
            <video autoplay loop muted playsinline controls poster="1000385669.jpg">
                <source src="boneco-falando.mp4" type="video/mp4">
                Seu navegador não suporta vídeos.
            </video>
        </div>

        <div class="action-area">
            <div class="instagram-box">
                <p>Clique no link da Bio e saiba mais:</p>
                <a href="https://www.instagram.com/carlamitertech" target="_blank" class="instagram-link">
                    @carlamitertech
                </a>
            </div>
        </div>
    </div>

</body>
</html>
