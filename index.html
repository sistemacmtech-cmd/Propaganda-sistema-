<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlamitertech - Apresentação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 380px;
            background: #18181c;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #2a2a32;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .brand-header {
            font-size: 0.85rem;
            color: #38ef7d;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(56, 239, 125, 0.3);
        }

        /* Balão de fala */
        .speech-bubble {
            position: relative;
            background: #25252e;
            border: 2px solid #3a3a48;
            border-radius: 18px;
            padding: 16px 20px;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .speech-bubble h2 {
            font-size: 1rem;
            color: #ffffff;
            font-weight: 600;
            line-height: 1.5;
        }

        /* Container da Imagem da Mascote */
        .mascot-box {
            position: relative;
            width: 100%;
            max-width: 240px;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mascot-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
        }

        /* Botão para ativar a voz caso o navegador bloqueie */
        .btn-audio {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #38ef7d, #11998e);
            color: #0f0f12;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
            transition: opacity 0.2s ease;
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
        }

        .btn-audio:hover {
            opacity: 0.9;
        }

        .action-area {
            width: 100%;
        }

        .instagram-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(56, 239, 125, 0.3);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }

        .instagram-box p {
            font-size: 0.95rem;
            color: #cccccc;
            margin-bottom: 8px;
        }

        .instagram-link {
            display: inline-block;
            color: #38ef7d;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .instagram-link:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="brand-header">Carlamitertech</div>

        <div class="speech-bubble">
            <h2>Você já conhece o nosso serviço?<br>Clique no link da Bio e saiba mais!</h2>
        </div>

        <!-- Imagem estática e perfeita da mascote -->
        <div class="mascot-box">
            <img src="1000385669.jpg" alt="Mascote Carlamitertech">[span_1](start_span)[span_1](end_span)
        </div>

        <!-- Botão interativo para reproduzir a voz com som garantido -->
        <button class="btn-audio" onclick="tocarVoz()">
            🔊 Ouvir a Mascote Falando
        </button>

        <div class="action-area">
            <div class="instagram-box">
                <p>Siga nossa página:</p>
                <a href="https://www.instagram.com/carlamitertech" target="_blank" class="instagram-link">
                    @carlamitertech
                </a>
            </div>
        </div>
    </div>

    <script>
        function tocarVoz() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                const texto = "Você já conhece o nosso serviço? Clique no link da Bio e saiba mais!";
                const utterance = new SpeechSynthesisUtterance(texto);
                
                utterance.lang = 'pt-BR';
                utterance.rate = 1.05; // Velocidade natural
                utterance.pitch = 1.1;  // Tom amigável

                window.speechSynthesis.speak(utterance);
            } else {
                alert("Seu navegador não suporta a reprodução de voz.");
            }
        }

        // Tenta falar automaticamente ao abrir (caso o navegador permita)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(tocarVoz, 800);
        });
    </script>

</body>
</html>
